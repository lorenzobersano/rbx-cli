[package]
name = "rbx-cli"
version = "0.1.0"
edition = "2021"
authors = ["Lorenzo Bersano"]
description = "Command-line analysis and USB export built on rbxport's crates."
# Links rbxport's GPL crates.
license = "GPL-2.0-or-later"
readme = "README.md"
repository = "https://github.com/lorenzobersano/rbx-cli"
keywords = ["rekordbox", "cdj", "pioneer", "dj", "usb"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
# rbxport 1.9.0, pinned: these crates have no API stability promise.
rbl-analysis = { git = "https://github.com/chrisle/rbxport", rev = "7fb4dad3f88a2cc0cecec0e718b4dde408fd7448" }
rbl-anlz = { git = "https://github.com/chrisle/rbxport", rev = "7fb4dad3f88a2cc0cecec0e718b4dde408fd7448" }
rbl-audio = { git = "https://github.com/chrisle/rbxport", rev = "7fb4dad3f88a2cc0cecec0e718b4dde408fd7448" }
rbl-core = { git = "https://github.com/chrisle/rbxport", rev = "7fb4dad3f88a2cc0cecec0e718b4dde408fd7448" }
rbl-export = { git = "https://github.com/chrisle/rbxport", rev = "7fb4dad3f88a2cc0cecec0e718b4dde408fd7448" }
rbl-pdb = { git = "https://github.com/chrisle/rbxport", rev = "7fb4dad3f88a2cc0cecec0e718b4dde408fd7448" }
# Tags and embedded covers: rbxport reads these from rekordbox's database.
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
# The DSP and SQLCipher are unusable unoptimised (rbxport does the same).
opt-level = 2
